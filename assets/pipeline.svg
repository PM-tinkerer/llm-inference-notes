<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 452" role="img" aria-labelledby="title desc"><title id="title">Prefill 与 Decode 流程</title><desc id="desc">先处理已知输入，采样首Token；后续循环处理刚采样的Token，并追加KV。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7d987a"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="15" y="25" fill="#193f36" font-size="17">01 / 从输入到首 Token，再进入生成循环</text><rect x="15" y="50" width="195" height="75" rx="9" fill="#fff" stroke="#b4c6b2"/><text x="30" y="79" fill="#193f36" font-size="17">Tokenizer → Embedding</text><text x="30" y="103" fill="#61756c" font-size="12">文本 → ID → 向量</text><path d="M210 88 L245 88" stroke="#7d987a" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="250" y="50" width="210" height="75" rx="9" fill="#fff" stroke="#b4c6b2"/><text x="265" y="79" fill="#193f36" font-size="17">Prefill · 处理输入</text><text x="265" y="103" fill="#61756c" font-size="12">每层建立输入位置的 KV</text><path d="M460 88 L495 88" stroke="#7d987a" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="500" y="50" width="205" height="75" rx="9" fill="#f8ead8" stroke="#b4c6b2"/><text x="515" y="79" fill="#193f36" font-size="17">LM Head → 采样</text><text x="515" y="103" fill="#61756c" font-size="12">得到第一个输出 Token</text><path d="M603 125 L603 177" stroke="#7d987a" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="430" y="185" width="275" height="80" rx="9" fill="#fff" stroke="#b4c6b2"/><text x="445" y="214" fill="#193f36" font-size="17">Decode · 处理刚生成的 Token</text><text x="445" y="238" fill="#61756c" font-size="12">每层计算新 Q/K/V，读取历史 KV</text><path d="M430 224 L390 224" stroke="#7d987a" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="140" y="185" width="245" height="80" rx="9" fill="#fff" stroke="#b4c6b2"/><text x="155" y="214" fill="#193f36" font-size="17">LM Head → 下一次采样</text><text x="155" y="238" fill="#61756c" font-size="12">继续生成，或满足停止条件</text><path d="M260 265 V300 H650 V265" fill="none" stroke="#7d987a" stroke-width="2" marker-end="url(#a)"/><text x="335" y="324" fill="#193f36" font-size="13">未结束：回送刚生成的 Token</text><rect x="15" y="360" width="690" height="72" rx="9" fill="#e4ecdf" stroke="#b4c6b2"/><text x="30" y="389" fill="#193f36" font-size="17">每层 KV Cache：保留历史 K/V，按处理进度追加</text><text x="30" y="413" fill="#61756c" font-size="12">Decode 不重算历史位置的 FFN；仍需访问历史 K/V。</text></g></svg>
