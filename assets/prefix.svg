<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">前缀KV共享</title><desc id="desc">请求A和B读取共享前缀KV，分别追加自己的后缀。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#7d987a"/></marker></defs><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="15" y="25" fill="#193f36" font-size="17">04 / 相同前缀共享，后续内容独立</text><rect x="15" y="130" width="245" height="90" rx="9" fill="#e2ebde" stroke="#b4c6b2"/><text x="30" y="159" fill="#193f36" font-size="17">共享前缀 KV</text><text x="30" y="183" fill="#61756c" font-size="12">相同 Token 与兼容上下文</text><path d="M260 157 L370 87" stroke="#7d987a" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M260 194 L370 274" stroke="#7d987a" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="380" y="50" width="325" height="85" rx="9" fill="#f8ead8" stroke="#b4c6b2"/><text x="395" y="79" fill="#193f36" font-size="17">请求 A · 私有后缀</text><text x="395" y="103" fill="#61756c" font-size="12">共享前缀 → 问题 A → 生成 A</text><rect x="380" y="235" width="325" height="85" rx="9" fill="#f8ead8" stroke="#b4c6b2"/><text x="395" y="264" fill="#193f36" font-size="17">请求 B · 私有后缀</text><text x="395" y="288" fill="#61756c" font-size="12">共享前缀 → 问题 B → 生成 B</text><text x="15" y="369" fill="#193f36" font-size="14">A 结束：释放 A 的引用；B 仍在使用时，公共块不可被覆盖。</text></g></svg>
